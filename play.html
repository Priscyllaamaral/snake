<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snaker</title>
<style>
:root{
  --bg:#1b1d22; --body:#2b2e36; --edge:#3a3e48;
  --lcd:#a8b98a; --ink:#1f2a17; --key:#3a3e48; --key-hi:#4a4f5c; --key-txt:#d8dbe2;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ --bg:#d9dce2; } }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:"Courier New",ui-monospace,monospace;overflow:hidden}
.phone{width:min(320px,92vw);background:var(--body);border:3px solid var(--edge);border-radius:38px;padding:14px 14px 20px;box-shadow:0 18px 50px rgba(0,0,0,.45);user-select:none;-webkit-user-select:none}
.notch{width:70px;height:7px;background:#16181c;border-radius:6px;margin:0 auto 12px}
.screen{background:var(--lcd);border-radius:10px;border:3px solid #16181c;padding:6px;color:var(--ink)}
.bar{display:flex;justify-content:space-between;font-size:12px;font-weight:bold;padding:0 2px 4px}
canvas{display:block;width:100%;image-rendering:pixelated;border:2px solid var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,58px);gap:8px;width:190px;margin:18px auto 14px}
.pad button{background:var(--key);color:var(--key-txt);border:0;border-radius:14px;font-size:22px;cursor:pointer;touch-action:manipulation}
.pad button:active{background:var(--key-hi);transform:translateY(1px)}
.pad .up{grid-area:1/2}.pad .left{grid-area:2/1}.pad .right{grid-area:2/3}.pad .down{grid-area:3/2}
.pad .mid{grid-area:2/2;background:#c8473f;font-size:13px;font-weight:bold}
.pad .mid:active{background:#a93a33}
.hint{text-align:center;color:#8c919d;font-size:11px;margin:0}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="screen">
    <div class="bar"><span id="pts">PONTOS: 0</span><span id="rec">REC: 0</span></div>
    <canvas id="c" width="260" height="286"></canvas>
  </div>
  <div class="pad">
    <button class="up" data-d="up" aria-label="Cima">▲</button>
    <button class="left" data-d="left" aria-label="Esquerda">◀</button>
    <button class="mid" id="go">START</button>
    <button class="right" data-d="right" aria-label="Direita">▶</button>
    <button class="down" data-d="down" aria-label="Baixo">▼</button>
  </div>
  <p class="hint">Setas ou WASD · Espaço inicia · Esc encerra</p>
</div>
<script>
const COLS=20, ROWS=22, S=13;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const ptsEl=document.getElementById('pts'), recEl=document.getElementById('rec'), goBtn=document.getElementById('go');
const INK='#1f2a17', LCD='#a8b98a';
const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
let snake, dir, nextDir, food, running=false, over=false, timer=null, record=0;

function score(){ return snake.length-6; }
// mesma regra do original: 180ms, menos 30ms a cada 10 pontos (mínimo 60ms)
function delay(){ return Math.max(60, 180 - 30*Math.floor(score()/10)); }

function reset(){
  const cx=Math.floor(COLS/2), cy=Math.floor(ROWS/2);
  snake=[[cx,cy],[cx-1,cy+1],[cx-2,cy],[cx-3,cy],[cx-4,cy],[cx-5,cy]];
  dir=nextDir=DIRS.right;
  placeFood(); over=false;
}
function placeFood(){
  const free=[];
  for(let x=0;x<COLS;x++)for(let y=0;y<ROWS;y++)
    if(!snake.some(s=>s[0]===x&&s[1]===y)) free.push([x,y]);
  food=free.length?free[Math.floor(Math.random()*free.length)]:null;
}
function tick(){
  dir=nextDir;
  const h=[snake[0][0]+dir[0], snake[0][1]+dir[1]];
  const eat=food&&h[0]===food[0]&&h[1]===food[1];
  const body=eat?snake:snake.slice(0,-1);
  if(h[0]<0||h[1]<0||h[0]>=COLS||h[1]>=ROWS||body.some(s=>s[0]===h[0]&&s[1]===h[1])) return end();
  snake.unshift(h);
  if(eat) placeFood(); else snake.pop();
  if(!food) return end();
  draw(); timer=setTimeout(tick,delay());
}
function start(){
  clearTimeout(timer); reset(); running=true;
  goBtn.textContent='PARAR'; draw(); timer=setTimeout(tick,delay());
}
function end(){
  clearTimeout(timer); running=false; over=true;
  record=Math.max(record,score()); goBtn.textContent='REINICIAR'; draw();
}
function turn(name){
  const d=DIRS[name];
  if(!running){ return; }
  if(d[0]===-dir[0]&&d[1]===-dir[1]) return; // não deixa voltar sobre si mesmo
  nextDir=d;
}
function cell(x,y,fill){ ctx.fillStyle=fill; ctx.fillRect(x*S+1,y*S+1,S-2,S-2); }
function text(t,y,size){
  ctx.fillStyle=INK; ctx.font='bold '+size+'px "Courier New",monospace'; ctx.textAlign='center';
  ctx.fillText(t,cv.width/2,y);
}
function draw(){
  ctx.fillStyle=LCD; ctx.fillRect(0,0,cv.width,cv.height);
  if(snake){
    snake.forEach(s=>cell(s[0],s[1],INK));
    if(food){ ctx.strokeStyle=INK; ctx.lineWidth=2; ctx.strokeRect(food[0]*S+3,food[1]*S+3,S-6,S-6); }
  }
  ptsEl.textContent='PONTOS: '+(snake?score():0);
  recEl.textContent='REC: '+record;
  if(over){ text('FIM DE JOGO',120,18); text('PONTOS: '+score(),148,14); }
  else if(!running){ text('SNAKER',120,24); text('aperte START',148,13); }
}
goBtn.addEventListener('click',()=>running?end():start());
document.querySelectorAll('[data-d]').forEach(b=>{
  const f=e=>{e.preventDefault();turn(b.dataset.d)};
  b.addEventListener('pointerdown',f);
});
addEventListener('keydown',e=>{
  const m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
  if(m[e.key]){e.preventDefault();turn(m[e.key]);}
  else if(e.key===' '){e.preventDefault();running?null:start();}
  else if(e.key==='Escape'&&running) end();
});
draw();
</script>
</body>
</html>
